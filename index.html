<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>签名板 · 网页手写签名生成器</title>
<meta name="description" content="单文件网页手写签名板：鼠标或触屏签名，导出透明 PNG，纯本地运行不上传。">
<meta name="theme-color" content="#f4f5f7">
<meta property="og:title" content="签名板 · 网页手写签名生成器">
<meta property="og:description" content="打开就能写，写完导出透明 PNG。单文件、无依赖、不联网。">
<meta property="og:type" content="website">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #f4f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #1f2329;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 6px; letter-spacing: .3px; }
  .sub { font-size: 13px; color: #8a8f99; margin: 0 0 20px; line-height: 1.6; }

  .card {
    background: #fff; border-radius: 12px; padding: 18px;
    box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 6px 20px rgba(0,0,0,.05);
  }

  .pad-shell {
    position: relative; border-radius: 8px; overflow: hidden;
    background-color: #fff;
    background-image:
      linear-gradient(45deg, #f0f1f3 25%, transparent 25%, transparent 75%, #f0f1f3 75%),
      linear-gradient(45deg, #f0f1f3 25%, transparent 25%, transparent 75%, #f0f1f3 75%);
    background-size: 14px 14px;
    background-position: 0 0, 7px 7px;
    border: 1px solid #e3e5e8;
  }
  canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; }

  .baseline {
    position: absolute; left: 6%; right: 6%; bottom: 26%;
    border-bottom: 1px dashed #d4d7dc; pointer-events: none;
  }
  .baseline span {
    position: absolute; right: 0; bottom: 4px;
    font-size: 12px; color: #c2c6cc; letter-spacing: 2px;
  }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
  .group { display: flex; align-items: center; gap: 7px; }
  .group > label { font-size: 13px; color: #5c6270; }

  .swatch {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; padding: 0; outline: none;
    box-shadow: 0 0 0 1px #dcdfe4 inset;
  }
  .swatch.on { border-color: #fff; box-shadow: 0 0 0 2px #1f2329; }

  input[type=range] { width: 110px; accent-color: #1f2329; cursor: pointer; }
  input[type=date] {
    font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 6px;
    border: 1px solid #dcdfe4; color: #1f2329; background: #fff;
  }
  input[type=checkbox] { accent-color: #1f2329; width: 15px; height: 15px; cursor: pointer; }

  .spacer { flex: 1 1 auto; }

  button {
    font: inherit; font-size: 13px; padding: 8px 15px; border-radius: 7px;
    border: 1px solid #dcdfe4; background: #fff; color: #1f2329;
    cursor: pointer; transition: background .12s, border-color .12s;
  }
  button:hover { background: #f7f8fa; border-color: #c8ccd2; }
  button:active { background: #eff0f2; }
  button.primary { background: #1f2329; border-color: #1f2329; color: #fff; }
  button.primary:hover { background: #33383f; }
  button:disabled { opacity: .38; cursor: not-allowed; }

  .hint {
    margin-top: 16px; font-size: 12.5px; color: #8a8f99; line-height: 1.75;
    border-top: 1px solid #eef0f2; padding-top: 14px;
  }
  .hint b { color: #5c6270; font-weight: 600; }
  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 16px);
    background: #1f2329; color: #fff; font-size: 13px; padding: 9px 18px;
    border-radius: 20px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 620px) {
    .wrap { padding: 18px 12px 36px; }
    h1 { font-size: 17px; }
    .card { padding: 12px; border-radius: 10px; }
    .toolbar { gap: 8px; }
    .spacer { display: none; }
    .toolbar.foot button { flex: 1 1 0; }
    input[type=range] { width: 84px; }
    .baseline { bottom: 30%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>手写签名板</h1>
  <p class="sub">用鼠标或触屏在下面的框里写名字，写完导出 PNG。全程在本机运行，不上传任何东西。</p>

  <div class="card">
    <div class="pad-shell">
      <canvas id="pad"></canvas>
      <div class="baseline"><span>签名</span></div>
    </div>

    <div class="toolbar">
      <div class="group">
        <label>颜色</label>
        <button class="swatch on" data-color="#111111" style="background:#111111" title="黑"></button>
        <button class="swatch" data-color="#1a3a8f" style="background:#1a3a8f" title="蓝黑"></button>
        <button class="swatch" data-color="#000080" style="background:#000080" title="蓝"></button>
      </div>

      <div class="group">
        <label>粗细</label>
        <input id="width" type="range" min="1.5" max="8" step="0.5" value="3.2">
      </div>

      <div class="group">
        <label style="gap:6px; display:flex; align-items:center;">
          <input id="withDate" type="checkbox"> 加日期
        </label>
        <input id="date" type="date">
      </div>

      <div class="spacer"></div>

      <button id="undo">撤销</button>
      <button id="clear">清空</button>
    </div>

    <div class="toolbar foot" style="margin-top:12px">
      <button id="savePng" class="primary">导出透明 PNG</button>
      <button id="saveWhite">导出白底 PNG</button>
    </div>

    <div class="hint">
      <b>承诺书小提醒：</b>签名一般用黑色签字笔；日期最好也手写。如果承诺书要求「本人已阅读全文并抄写」，那就得真笔手写，贴图不行。需要按手印的，打印出来签完再按。
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  const W = 1200, H = 420, S = 2;          // 逻辑尺寸 × 超采样，导出更清晰
  const cvs = document.getElementById('pad');
  const ctx = cvs.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 3);

  function setup() {
    cvs.width = W * S;
    cvs.height = H * S;
    cvs.style.aspectRatio = W + ' / ' + H;
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }

  let color = '#111111';
  let lineWidth = 3.2;
  let drawing = false;
  let last = null;
  const history = [];
  const MAX_HISTORY = 6;

  function snapshot() {
    try { history.push(ctx.getImageData(0, 0, cvs.width, cvs.height)); } catch (e) {}
    if (history.length > MAX_HISTORY) history.shift();
  }

  function clearAll() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    ctx.restore();
    history.length = 0;
  }

  function pos(e) {
    const r = cvs.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width * W,
      y: (e.clientY - r.top) / r.height * H
    };
  }

  function start(e) {
    if (e.button !== undefined && e.button !== 0) return;
    drawing = true;
    snapshot();
    last = pos(e);
    cvs.setPointerCapture && cvs.setPointerCapture(e.pointerId);
    // 点一下也要留墨
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(last.x, last.y, lineWidth / 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function move(e) {
    if (!drawing) return;
    const p = pos(e);
    const mx = (last.x + p.x) / 2;
    const my = (last.y + p.y) / 2;
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.quadraticCurveTo(last.x, last.y, mx, my);
    ctx.stroke();
    last = p;
  }

  function end() { drawing = false; last = null; }

  cvs.addEventListener('pointerdown', start);
  cvs.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  cvs.addEventListener('contextmenu', e => e.preventDefault());

  document.querySelectorAll('.swatch').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.swatch').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      color = btn.dataset.color;
    });
  });

  document.getElementById('width').addEventListener('input', e => {
    lineWidth = parseFloat(e.target.value);
  });

  document.getElementById('undo').addEventListener('click', () => {
    const img = history.pop();
    if (!img) { toast('没有可撤销的笔迹'); return; }
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.putImageData(img, 0, 0);
    ctx.restore();
    // putImageData 会把变换状态之外的像素覆盖，重建变换以继续书写
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  });

  document.getElementById('clear').addEventListener('click', () => {
    clearAll();
    toast('已清空');
  });

  // 日期默认今天
  const dateInput = document.getElementById('date');
  const now = new Date();
  const iso = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');
  dateInput.value = iso;

  function compose(whiteBg) {
    const out = document.createElement('canvas');
    out.width = cvs.width;
    out.height = cvs.height + (document.getElementById('withDate').checked ? Math.round(64 * S) : 0);
    const o = out.getContext('2d');

    if (whiteBg) {
      o.fillStyle = '#ffffff';
      o.fillRect(0, 0, out.width, out.height);
    }
    o.drawImage(cvs, 0, 0);

    if (document.getElementById('withDate').checked) {
      const v = dateInput.value || iso;
      const [y, m, d] = v.split('-');
      const text = y + ' 年 ' + parseInt(m, 10) + ' 月 ' + parseInt(d, 10) + ' 日';
      o.setTransform(S, 0, 0, S, 0, 0);
      o.fillStyle = color;
      o.font = '400 30px "KaiTi", "STKaiti", "Microsoft YaHei", sans-serif';
      o.textAlign = 'right';
      o.textBaseline = 'bottom';
      o.fillText(text, W - 40, H + 54);
    }
    return out;
  }

  function isEmpty() {
    const d = ctx.getImageData(0, 0, cvs.width, cvs.height).data;
    for (let i = 3; i < d.length; i += 4) if (d[i] > 0) return false;
    return true;
  }

  function download(whiteBg, name) {
    if (isEmpty()) { toast('先写个名字再导出'); return; }
    const out = compose(whiteBg);
    const a = document.createElement('a');
    a.download = name;
    a.href = out.toDataURL('image/png');
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('已导出 ' + name);
  }

  document.getElementById('savePng').addEventListener('click', () => download(false, '签名_透明.png'));
  document.getElementById('saveWhite').addEventListener('click', () => download(true, '签名_白底.png'));

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1700);
  }

  setup();
})();
</script>
</body>
</html>
