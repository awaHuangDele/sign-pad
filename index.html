<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>签名板 · 网页手写签名生成器</title>
<meta name="description" content="单文件网页手写签名板：鼠标或触屏签名，导出透明 PNG，纯本地运行不上传。">
<meta name="theme-color" content="#f4f5f7">
<meta property="og:title" content="签名板 · 网页手写签名生成器">
<meta property="og:description" content="打开就能写，写完导出透明 PNG。单文件、无依赖、不联网。">
<meta property="og:type" content="website">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #f4f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #1f2329;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 6px; letter-spacing: .3px; }
  .sub { font-size: 13px; color: #8a8f99; margin: 0 0 20px; line-height: 1.6; }

  .card {
    background: #fff; border-radius: 12px; padding: 18px;
    box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 6px 20px rgba(0,0,0,.05);
  }

  .pad-shell {
    position: relative; border-radius: 8px; overflow: hidden;
    background-color: #fefefd;
    background-image: radial-gradient(130% 110% at 50% -10%, #ffffff 0%, #fcfbf8 55%, #f8f5f0 100%);
    border: 1px solid #e9e6e0;
    box-shadow: inset 0 1px 3px rgba(60, 50, 35, .03);
  }
  canvas {
    display: block; width: 100%; height: auto; touch-action: none;
    cursor: crosshair; user-select: none; -webkit-user-select: none;
  }

  .baseline {
    position: absolute; left: 6%; right: 6%; bottom: 26%;
    border-bottom: 1px dashed #d4d7dc; pointer-events: none;
  }
  .baseline span {
    position: absolute; right: 0; bottom: 4px;
    font-size: 12px; color: #c2c6cc; letter-spacing: 2px;
  }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
  .group { display: flex; align-items: center; gap: 7px; }
  .group > label { font-size: 13px; color: #5c6270; }

  .swatch {
    display: inline-block; position: relative; overflow: hidden;
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; padding: 0; outline: none; flex: 0 0 auto;
    box-shadow: 0 0 0 1px #dcdfe4 inset;
    transition: transform .1s;
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch.on { border-color: #fff; box-shadow: 0 0 0 2px #1f2329; }

  .swatch.custom {
    background: conic-gradient(from 30deg, #e5484d, #f5a623, #46a758, #12a594, #0090ff, #8e4ec6, #e5484d);
  }
  .swatch.custom input[type=color] {
    position: absolute; inset: -6px; width: 44px; height: 44px;
    border: 0; padding: 0; opacity: 0; cursor: pointer;
  }

  input[type=range] { width: 110px; accent-color: #1f2329; cursor: pointer; }
  input[type=date] {
    font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 6px;
    border: 1px solid #dcdfe4; color: #1f2329; background: #fff;
  }
  input[type=checkbox] { accent-color: #1f2329; width: 15px; height: 15px; cursor: pointer; }

  .spacer { flex: 1 1 auto; }

  button {
    font: inherit; font-size: 13px; padding: 8px 15px; border-radius: 7px;
    border: 1px solid #dcdfe4; background: #fff; color: #1f2329;
    cursor: pointer; transition: background .12s, border-color .12s;
  }
  button:hover { background: #f7f8fa; border-color: #c8ccd2; }
  button:active { background: #eff0f2; }
  button.primary { background: #1f2329; border-color: #1f2329; color: #fff; }
  button.primary:hover { background: #33383f; }
  button:disabled { opacity: .38; cursor: not-allowed; }

  .hint {
    margin-top: 16px; font-size: 12.5px; color: #8a8f99; line-height: 1.75;
    border-top: 1px solid #eef0f2; padding-top: 14px;
  }
  .hint b { color: #5c6270; font-weight: 600; }

  .wprev {
    width: 26px; height: 26px; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; background: #fafbfc;
    box-shadow: 0 0 0 1px #e3e5e8 inset;
  }
  .wprev i {
    display: block; width: 7px; height: 7px; border-radius: 50%;
    background: #1f2329; transition: width .1s, height .1s;
  }

  .tval {
    font-size: 12px; color: #8a8f99; min-width: 32px; text-align: right;
    font-variant-numeric: tabular-nums;
  }

  input[type=date]:disabled { opacity: .42; cursor: not-allowed; }

  #clear.armed {
    background: #fdecec; border-color: #eeb0b0; color: #b3261e;
  }
  #clear.armed:hover { background: #fbdede; }

  /* 力度热力图 */
  #heat {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #heat.show { opacity: 1; }
  #pad.faded { opacity: .2; transition: opacity .25s; }

  .heat-legend {
    position: absolute; right: 12px; bottom: 10px;
    display: none; align-items: center; gap: 6px;
    font-size: 11px; color: #7b818c;
    background: rgba(255, 255, 255, .87); padding: 4px 9px; border-radius: 20px;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .07); pointer-events: none;
  }
  .heat-legend.on { display: flex; }
  .heat-legend em { font-style: normal; opacity: .72; margin-left: 1px; }
  .heat-legend i {
    display: block; width: 68px; height: 6px; border-radius: 3px;
    background: linear-gradient(90deg,
      hsl(220, 92%, 55%), hsl(160, 90%, 42%), hsl(110, 85%, 45%),
      hsl(55, 92%, 50%), hsl(0, 92%, 55%));
  }

  button.toggle.on { background: #1f2329; border-color: #1f2329; color: #fff; }

  /* PDF 签字 */
  .pdf-card { margin-top: 18px; }
  .card-head h2 { font-size: 15px; font-weight: 600; margin: 0 0 5px; }
  .card-head p { font-size: 12.5px; color: #8a8f99; margin: 0 0 16px; line-height: 1.65; }

  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 5px; padding: 26px 16px; border-radius: 9px; cursor: pointer;
    border: 1.5px dashed #d6d9de; background: #fbfbfc;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: #9aa1ac; background: #f5f6f8; }
  .drop b { font-size: 13.5px; font-weight: 600; }
  .drop small { font-size: 12px; color: #9298a2; }

  .pdf-bar { display: flex; align-items: center; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
  .pdf-pageno {
    font-size: 12.5px; color: #5c6270; min-width: 46px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  button.mini { padding: 5px 11px; font-size: 12.5px; }
  .pdf-size-label { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #5c6270; }
  .pdf-tip { font-size: 12px; color: #9298a2; }

  .pdf-stage {
    display: flex; justify-content: center; padding: 14px;
    background: #f0f1f3; border-radius: 9px;
  }
  .pdf-page {
    position: relative; width: 100%; max-width: 440px;
    background: #fff; box-shadow: 0 2px 14px rgba(0, 0, 0, .14);
    border-radius: 2px; overflow: hidden; touch-action: none;
  }
  #pdfSig {
    position: absolute; left: 30%; top: 78%; width: 26%;
    cursor: grab; user-select: none; -webkit-user-select: none;
    transform: translate(-50%, -50%);
  }
  #pdfSig:active { cursor: grabbing; }
  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 16px);
    background: #1f2329; color: #fff; font-size: 13px; padding: 9px 18px;
    border-radius: 20px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 620px) {
    .wrap { padding: 18px 12px 36px; }
    h1 { font-size: 17px; }
    .card { padding: 12px; border-radius: 10px; }
    .toolbar { gap: 8px; }
    .spacer { display: none; }
    .toolbar.foot button { flex: 1 1 0; }
    input[type=range] { width: 84px; }
    .baseline { bottom: 30%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>手写签名板</h1>
  <p class="sub">用鼠标或触屏在下面的框里写名字，写完导出 PNG。全程在本机运行，不上传任何东西。</p>

  <div class="card">
    <div class="pad-shell">
      <canvas id="pad"></canvas>
      <canvas id="heat"></canvas>
      <div class="baseline"><span>签名</span></div>
      <div class="heat-legend" id="heatLegend">
        <span>轻</span><i></i><span>重</span>
        <em id="heatSrc"></em>
      </div>
    </div>

    <div class="toolbar">
      <div class="group">
        <label>墨水</label>
        <button class="swatch on" data-color="#000000" style="background:#000000" title="纯黑"></button>
        <button class="swatch" data-color="#333333" style="background:#333333" title="深灰"></button>
        <button class="swatch" data-color="#1a3a8f" style="background:#1a3a8f" title="蓝黑 · 公文常用"></button>
        <button class="swatch" data-color="#0a4fa8" style="background:#0a4fa8" title="标准蓝"></button>
        <button class="swatch" data-color="#002060" style="background:#002060" title="藏青"></button>
        <button class="swatch" data-color="#c62828" style="background:#c62828" title="红"></button>
        <label class="swatch custom" title="自定义颜色">
          <input type="color" id="customColor" value="#000000" aria-label="自定义颜色">
        </label>
      </div>

      <div class="group">
        <label>粗细</label>
        <input id="width" type="range" min="1.5" max="8" step="0.5" value="3.2">
        <span class="wprev" aria-hidden="true"><i id="wprevDot"></i></span>
      </div>

      <div class="group">
        <label>笔锋</label>
        <input id="taper" type="range" min="0" max="100" step="5" value="70">
        <span class="tval" id="tval">70%</span>
      </div>

      <div class="group">
        <label style="gap:6px; display:flex; align-items:center;">
          <input id="withDate" type="checkbox"> 加日期
        </label>
        <input id="date" type="date">
      </div>

      <div class="spacer"></div>

      <button id="heatBtn" class="toggle" title="按书写力度/速度给笔迹上色">力度热力图</button>
      <button id="undo" disabled>撤销</button>
      <button id="clear">清空</button>
    </div>

    <div class="toolbar foot" style="margin-top:12px">
      <button id="copyBtn" class="primary">复制图片</button>
      <button id="savePng">导出透明 PNG</button>
      <button id="saveWhite">导出白底 PNG</button>
    </div>

    <div class="hint">
      <b>承诺书小提醒：</b>签名一般用黑色签字笔；日期最好也手写。如果承诺书要求「本人已阅读全文并抄写」，那就得真笔手写，贴图不行。需要按手印的，打印出来签完再按。
    </div>
  </div>

  <div class="card pdf-card">
    <div class="card-head">
      <h2>在 PDF 上签字</h2>
      <p>选一份 PDF，把签名拖到落款处，直接导出签好的文件。文件只在浏览器内存里处理，不上传。</p>
    </div>

    <label class="drop" id="pdfDrop">
      <input type="file" id="pdfFile" accept="application/pdf" hidden>
      <b>选择 PDF 文件</b>
      <small>也可以直接把文件拖到这里</small>
    </label>

    <div class="pdf-editor" id="pdfEditor" hidden>
      <div class="pdf-bar">
        <button id="pdfPrev" class="mini" aria-label="上一页">←</button>
        <span class="pdf-pageno" id="pdfPageInfo">1 / 1</span>
        <button id="pdfNext" class="mini" aria-label="下一页">→</button>
        <span class="spacer"></span>
        <label class="pdf-size-label">签名宽度
          <input id="pdfSize" type="range" min="10" max="70" step="1" value="26">
          <span class="tval" id="pdfSizeVal">26%</span>
        </label>
      </div>

      <div class="pdf-stage">
        <div class="pdf-page" id="pdfPage">
          <img id="pdfSig" alt="签名位置" draggable="false">
        </div>
      </div>

      <div class="pdf-bar">
        <button id="pdfApply" class="primary">下载签好的 PDF</button>
        <button id="pdfReset" class="mini">换一个文件</button>
        <span class="spacer"></span>
        <span class="pdf-tip" id="pdfTip"></span>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  const W = 1200, H = 420, S = 2;          // 逻辑尺寸 × 超采样，导出更清晰
  const DATE_GAP = 64;                     // 勾选日期时，内容画布下方追加的逻辑高度
  const CROP_PAD = 24;                     // 导出裁剪时四周留的逻辑留白
  const cvs = document.getElementById('pad');
  const ctx = cvs.getContext('2d');

  function setup() {
    cvs.width = W * S;
    cvs.height = H * S;
    cvs.style.aspectRatio = W + ' / ' + H;
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }

  let color = '#000000';
  let lineWidth = 3.2;
  let inkStrength = 0.7;      // 笔锋强度 0–1
  let curW = 1;               // 当前笔画宽度系数，跟着压力或速度走
  let lastT = 0;
  let drawing = false;
  let prev = null, prevMid = null, moved = false;
  let strokes = [];           // 每一笔的段数据，供热力图和后续重绘使用
  let curSegs = null;
  let lastPointerType = 'mouse';
  const history = [];
  const MAX_HISTORY = 6;
  const undoBtn = document.getElementById('undo');

  function syncUndo() { undoBtn.disabled = history.length === 0; }

  // 快照同时存像素和笔画数据，撤销时两者一起回退，否则热力图会和画面脱节
  function snapshot() {
    try {
      history.push({
        img: ctx.getImageData(0, 0, cvs.width, cvs.height),
        strokes: strokes.slice()
      });
    } catch (e) {}
    if (history.length > MAX_HISTORY) history.shift();
    syncUndo();
  }

  // 清空笔迹但保留历史 —— 清空本身也应该能撤销回来
  function clearCanvas() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    ctx.restore();
  }

  function toLocal(e, r) {
    return {
      x: (e.clientX - r.left) / r.width * W,
      y: (e.clientY - r.top) / r.height * H
    };
  }

  function applyStyle() {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }

  // 每段都从「上一个中点」画到「当前中点」，以上一个采样点为控制点。
  // 起点接上一段的终点，段与段首尾相连，中间不留缝。
  // 线宽逐段设置，配合压感才有笔锋
  function segment(p, wf) {
    const mid = { x: (prev.x + p.x) / 2, y: (prev.y + p.y) / 2 };
    ctx.lineWidth = Math.max(0.4, lineWidth * wf);
    ctx.beginPath();
    ctx.moveTo(prevMid.x, prevMid.y);
    ctx.quadraticCurveTo(prev.x, prev.y, mid.x, mid.y);
    ctx.stroke();
    if (curSegs) {
      curSegs.push({ x0: prevMid.x, y0: prevMid.y, cx: prev.x, cy: prev.y, x1: mid.x, y1: mid.y, w: wf });
    }
    prevMid = mid;
    prev = p;
  }

  // 笔锋来源：手写笔直接取压力；鼠标和手指没有压力，就用划动速度反推，
  // 划得快线细、划得慢线粗，接近真笔的手感
  function widthFactor(ev, p, now) {
    if (ev.pointerType === 'pen' && ev.pressure > 0.01) {
      return 0.55 + ev.pressure * 0.95;
    }
    const d = Math.sqrt((p.x - prev.x) * (p.x - prev.x) + (p.y - prev.y) * (p.y - prev.y));
    const dt = Math.max(1, now - lastT);
    const speed = d / dt;
    return Math.max(0.5, Math.min(1.15, 1.15 - speed * 0.42));
  }

  function start(e) {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    drawing = true;
    moved = false;
    snapshot();
    const r = cvs.getBoundingClientRect();
    const p = toLocal(e, r);
    prev = p; prevMid = p;
    curW = 0.62;                                   // 起笔略细
    lastT = e.timeStamp || performance.now();
    lastPointerType = e.pointerType || 'mouse';
    curSegs = [];
    try { cvs.setPointerCapture(e.pointerId); } catch (_) {}
    // 落笔先点一个圆，单击也能留下墨迹
    applyStyle();
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.4, lineWidth * (1 + (curW - 1) * inkStrength)) / 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const r = cvs.getBoundingClientRect();
    // 浏览器会把高频采样合并成一个事件，取出全部原始点，快速划动才不断线
    const raw = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    const list = (raw && raw.length) ? raw : [e];
    applyStyle();
    for (let i = 0; i < list.length; i++) {
      const ev = list[i];
      const p = toLocal(ev, r);
      // 亚像素抖动直接丢弃，否则细线会被反复擦断
      if (Math.abs(p.x - prev.x) + Math.abs(p.y - prev.y) < 0.35) continue;

      const now = ev.timeStamp || performance.now();
      const target = widthFactor(ev, p, now);
      // 平滑追随，避免线宽逐段跳变
      curW = curW * 0.62 + target * 0.38;
      segment(p, 1 + (curW - 1) * inkStrength);
      lastT = now;
      moved = true;
    }
  }

  function end() {
    if (!drawing) return;
    // 收笔补完最后半段，否则终点会比实际手势短一截
    if (moved && prev) {
      const wf = 1 + (curW - 1) * inkStrength;
      applyStyle();
      ctx.lineWidth = Math.max(0.4, lineWidth * wf);
      ctx.beginPath();
      ctx.moveTo(prevMid.x, prevMid.y);
      ctx.quadraticCurveTo(prev.x, prev.y, prev.x, prev.y);
      ctx.stroke();
      if (curSegs) {
        curSegs.push({ x0: prevMid.x, y0: prevMid.y, cx: prev.x, cy: prev.y, x1: prev.x, y1: prev.y, w: wf });
      }
    }
    if (curSegs && curSegs.length) strokes.push({ segs: curSegs });
    curSegs = null;
    drawing = false;
    prev = null; prevMid = null; moved = false;
    refreshHeat();
    refreshPdfSig();
  }

  cvs.addEventListener('pointerdown', start);
  cvs.addEventListener('pointermove', move, { passive: false });
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  cvs.addEventListener('pointerleave', end);
  cvs.addEventListener('contextmenu', e => e.preventDefault());

  function setActive(btn) {
    document.querySelectorAll('.swatch').forEach(b => b.classList.remove('on'));
    if (btn) btn.classList.add('on');
  }

  document.querySelectorAll('.swatch[data-color]').forEach(btn => {
    btn.addEventListener('click', () => {
      setActive(btn);
      color = btn.dataset.color;
    });
  });

  const customColor = document.getElementById('customColor');
  if (customColor) {
    customColor.addEventListener('input', () => {
      color = customColor.value;
      setActive(null);   // 自定义色不点亮任何预设
    });
  }

  const widthEl = document.getElementById('width');
  const wprevDot = document.getElementById('wprevDot');

  function syncWidth() {
    lineWidth = parseFloat(widthEl.value);
    if (wprevDot) {
      const d = Math.min(22, Math.max(3, lineWidth * 2.2));
      wprevDot.style.width = d + 'px';
      wprevDot.style.height = d + 'px';
    }
  }
  widthEl.addEventListener('input', syncWidth);

  const taperEl = document.getElementById('taper');
  const tvalEl = document.getElementById('tval');

  function syncTaper() {
    inkStrength = parseFloat(taperEl.value) / 100;
    if (tvalEl) tvalEl.textContent = Math.round(inkStrength * 100) + '%';
  }
  taperEl.addEventListener('input', syncTaper);

  function doUndo() {
    const snap = history.pop();
    if (!snap) { toast('没有可撤销的笔迹'); return; }
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.putImageData(snap.img, 0, 0);
    ctx.restore();
    // putImageData 直接写设备像素，之后要重建变换才能继续按逻辑坐标书写
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    strokes = snap.strokes.slice();
    syncUndo();
    refreshHeat();
    refreshPdfSig();
  }
  undoBtn.addEventListener('click', doUndo);

  // Ctrl / Cmd + Z 撤销
  window.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && (e.key || '').toLowerCase() === 'z' && !e.shiftKey) {
      e.preventDefault();
      doUndo();
    }
  });

  // 清空要点两次，误触一次不会丢东西；清空前的状态留在历史里，撤销能找回
  const clearBtn = document.getElementById('clear');
  let clearArmed = false, clearTimer;

  function disarmClear() {
    clearArmed = false;
    clearBtn.classList.remove('armed');
    clearBtn.textContent = '清空';
    clearTimeout(clearTimer);
  }

  clearBtn.addEventListener('click', () => {
    if (!clearArmed) {
      if (inkBounds(cvs) === null) { toast('画布本来就是空的'); return; }
      clearArmed = true;
      clearBtn.classList.add('armed');
      clearBtn.textContent = '再点一次';
      clearTimer = setTimeout(disarmClear, 3000);
      return;
    }
    disarmClear();
    snapshot();
    clearCanvas();
    strokes = [];
    refreshHeat();
    refreshPdfSig();
    toast('已清空，按撤销可找回');
  });

  // 日期默认今天
  const dateInput = document.getElementById('date');
  const now = new Date();
  const iso = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');
  dateInput.value = iso;

  // 不勾「加日期」时，日期框是没用的，直接禁用掉，省得误点
  const withDateEl = document.getElementById('withDate');
  function syncDateState() { dateInput.disabled = !withDateEl.checked; }
  withDateEl.addEventListener('change', syncDateState);

  // 把签名（以及可选的日期）合到一张等尺寸画布上，裁剪交给下一步。
  // 日期贴着签名的右下角走，不钉在画布右边 —— 否则裁剪后中间会空出一大片
  function buildContent() {
    const useDate = withDateEl.checked;
    const c = document.createElement('canvas');
    c.width = cvs.width;
    c.height = cvs.height + DATE_GAP * S;
    const o = c.getContext('2d');
    o.drawImage(cvs, 0, 0);

    const sig = inkBounds(cvs);

    if (useDate) {
      const v = dateInput.value || iso;
      const [y, m, d] = v.split('-');
      const text = y + ' 年 ' + parseInt(m, 10) + ' 月 ' + parseInt(d, 10) + ' 日';
      const ax = sig ? Math.min(W - 20, sig.x1 / S + 10) : W - 40;
      const ay = sig ? Math.min(H + 54, sig.y1 / S + 46) : H + 54;
      o.setTransform(S, 0, 0, S, 0, 0);
      o.fillStyle = color;
      o.font = '400 30px "KaiTi", "STKaiti", "Microsoft YaHei", sans-serif';
      o.textAlign = 'right';
      o.textBaseline = 'bottom';
      o.fillText(text, ax, ay);
    }
    return { canvas: c, sig: sig };
  }

  // 扫 alpha 通道求墨迹外接框（设备像素）。没有任何内容返回 null
  function inkBounds(c) {
    const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
    let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
    for (let y = 0; y < c.height; y++) {
      const row = y * c.width * 4;
      for (let x = 0; x < c.width; x++) {
        if (d[row + x * 4 + 3] > 8) {
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
      }
    }
    return x1 < 0 ? null : { x0: x0, y0: y0, x1: x1 + 1, y1: y1 + 1 };
  }

  function stamp() {
    const n = new Date();
    const p = v => String(v).padStart(2, '0');
    return '' + n.getFullYear() + p(n.getMonth() + 1) + p(n.getDate()) +
      '_' + p(n.getHours()) + p(n.getMinutes());
  }

  // 渲染 + 裁剪，返回可直接用的画布；一个字没写返回 null
  function renderCropped(whiteBg) {
    const built = buildContent();
    if (!built.sig) return null;
    const content = built.canvas;
    const b = inkBounds(content);

    // 按墨迹外接框裁掉四周空白，只留一点呼吸感
    const pad = CROP_PAD * S;
    const x0 = Math.max(0, b.x0 - pad);
    const y0 = Math.max(0, b.y0 - pad);
    const x1 = Math.min(content.width, b.x1 + pad);
    const y1 = Math.min(content.height, b.y1 + pad);

    const out = document.createElement('canvas');
    out.width = x1 - x0;
    out.height = y1 - y0;
    const o = out.getContext('2d');
    if (whiteBg) {
      o.fillStyle = '#ffffff';
      o.fillRect(0, 0, out.width, out.height);
    }
    o.drawImage(content, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    return out;
  }

  function download(whiteBg, base) {
    const out = renderCropped(whiteBg);
    if (!out) { toast('先写个名字再导出'); return; }
    const a = document.createElement('a');
    a.download = base + '_' + stamp() + '.png';
    a.href = out.toDataURL('image/png');
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('已导出 ' + out.width + ' × ' + out.height);
  }

  // 直接进剪贴板，切到 Word / WPS 按 Ctrl+V 就贴上了，省掉下载再找文件
  function copyImage() {
    const out = renderCropped(false);
    if (!out) { toast('先写个名字再复制'); return; }
    if (!navigator.clipboard || !window.ClipboardItem) {
      toast('这个浏览器不支持复制，请用导出 PNG');
      return;
    }
    out.toBlob(function (blob) {
      if (!blob) { toast('生成图片失败，请用导出 PNG'); return; }
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
        .then(function () { toast('已复制，去文档里粘贴即可'); })
        .catch(function () { toast('复制被浏览器拦下了，请用导出 PNG'); });
    }, 'image/png');
  }

  document.getElementById('copyBtn').addEventListener('click', copyImage);
  document.getElementById('savePng').addEventListener('click', () => download(false, '签名_透明'));
  document.getElementById('saveWhite').addEventListener('click', () => download(true, '签名_白底'));

  // ── 力度热力图 ─────────────────────────────────────────
  // 手写笔读真实压力；鼠标和触屏没有压力数据，只能用速度反推，
  // 所以图例里会标明当前是哪种来源，不把它说成测力计
  const heatCvs = document.getElementById('heat');
  const heatCtx = heatCvs.getContext('2d');
  const heatBtn = document.getElementById('heatBtn');
  const heatLegend = document.getElementById('heatLegend');
  const heatSrc = document.getElementById('heatSrc');
  let heatOn = false;

  function drawHeat() {
    heatCvs.width = cvs.width;
    heatCvs.height = cvs.height;

    const all = [];
    for (let i = 0; i < strokes.length; i++) {
      const segs = strokes[i].segs;
      for (let j = 0; j < segs.length; j++) all.push(segs[j]);
    }
    heatCtx.setTransform(1, 0, 0, 1, 0, 0);
    heatCtx.clearRect(0, 0, heatCvs.width, heatCvs.height);
    if (!all.length) return;

    // 按本次书写实际用到的范围归一化，不同设备都能铺满整个色域
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < all.length; i++) {
      if (all[i].w < lo) lo = all[i].w;
      if (all[i].w > hi) hi = all[i].w;
    }
    if (hi - lo < 0.04) { const m = (lo + hi) / 2; lo = m - 0.02; hi = m + 0.02; }

    // 先画到临时画布，再整体模糊一次盖上去，比逐段 filter 快得多
    const tmp = document.createElement('canvas');
    tmp.width = cvs.width;
    tmp.height = cvs.height;
    const t2 = tmp.getContext('2d');
    t2.setTransform(S, 0, 0, S, 0, 0);
    t2.lineCap = 'round';
    t2.lineJoin = 'round';
    t2.globalAlpha = 0.6;

    for (let i = 0; i < all.length; i++) {
      const g = all[i];
      const t = Math.max(0, Math.min(1, (g.w - lo) / (hi - lo)));
      t2.strokeStyle = 'hsl(' + (220 - t * 220) + ', 92%, 52%)';
      t2.lineWidth = Math.max(2.5, lineWidth * g.w * 1.55);
      t2.beginPath();
      t2.moveTo(g.x0, g.y0);
      t2.quadraticCurveTo(g.cx, g.cy, g.x1, g.y1);
      t2.stroke();
    }

    heatCtx.save();
    heatCtx.filter = 'blur(' + Math.round(3.5 * S) + 'px)';
    heatCtx.drawImage(tmp, 0, 0);
    heatCtx.restore();
    heatCtx.globalAlpha = 0.62;      // 再叠一层清晰的，保住笔迹轮廓
    heatCtx.drawImage(tmp, 0, 0);
    heatCtx.globalAlpha = 1;
  }

  function refreshHeat() { if (heatOn) drawHeat(); }

  heatBtn.addEventListener('click', () => {
    heatOn = !heatOn;
    heatBtn.classList.toggle('on', heatOn);
    heatCvs.classList.toggle('show', heatOn);
    cvs.classList.toggle('faded', heatOn);
    heatLegend.classList.toggle('on', heatOn);
    if (heatSrc) {
      heatSrc.textContent = lastPointerType === 'pen' ? '真实压感' : '速度反推';
      heatSrc.title = lastPointerType === 'pen'
        ? '数据来自手写笔的真实压力'
        : '鼠标和触屏没有压力数据，这里按书写速度推算，不是真实压力';
    }
    if (heatOn) drawHeat();
  });

  // ── PDF 签字 ───────────────────────────────────────────
  // 用 DOM 按 PDF 真实页面比例画一张示意页，签名拖到落点上，导出时按同样的
  // 相对坐标写进去。这样不必引入 PDF.js 渲染引擎（那又要多 1MB）
  const pdfFileEl = document.getElementById('pdfFile');
  const pdfDrop = document.getElementById('pdfDrop');
  const pdfEditor = document.getElementById('pdfEditor');
  const pdfPage = document.getElementById('pdfPage');
  const pdfSig = document.getElementById('pdfSig');
  const pdfPageInfo = document.getElementById('pdfPageInfo');
  const pdfSizeEl = document.getElementById('pdfSize');
  const pdfSizeVal = document.getElementById('pdfSizeVal');
  const pdfTip = document.getElementById('pdfTip');

  const pdfState = {
    lib: null, bytes: null, doc: null, pageCount: 0, pageIndex: 0,
    size: { w: 595, h: 842 }, pos: { x: 30, y: 78 }, ratio: 26, name: 'document'
  };

  let pdfLibPromise = null;
  function loadPdfLib() {
    if (window.PDFLib) return Promise.resolve(window.PDFLib);
    if (!pdfLibPromise) {
      pdfLibPromise = new Promise(function (resolve, reject) {
        const s = document.createElement('script');
        s.src = 'vendor/pdf-lib.min.js';
        s.onload = function () {
          if (window.PDFLib) resolve(window.PDFLib);
          else reject(new Error('lib'));
        };
        s.onerror = function () { reject(new Error('lib')); };
        document.head.appendChild(s);
      });
    }
    return pdfLibPromise;
  }

  function applySigPos() {
    pdfSig.style.left = pdfState.pos.x + '%';
    pdfSig.style.top = pdfState.pos.y + '%';
    pdfSig.style.width = pdfState.ratio + '%';
  }

  function syncSigPreview() {
    const out = renderCropped(false);
    if (!out) {
      pdfSig.style.display = 'none';
      pdfTip.textContent = '先在上面写个签名';
      return;
    }
    pdfSig.style.display = '';
    pdfSig.src = out.toDataURL('image/png');
    pdfTip.textContent = '';
    applySigPos();
  }

  function syncPageView() {
    if (!pdfState.doc) return;
    const sz = pdfState.doc.getPage(pdfState.pageIndex).getSize();
    pdfState.size = { w: sz.width, h: sz.height };
    pdfPage.style.aspectRatio = sz.width + ' / ' + sz.height;
    pdfPageInfo.textContent = (pdfState.pageIndex + 1) + ' / ' + pdfState.pageCount;
    applySigPos();
  }

  async function openPdf(file) {
    if (!file) return;
    if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') {
      toast('请选一个 PDF 文件');
      return;
    }
    pdfTip.textContent = '正在读取…';
    try {
      const lib = await loadPdfLib();
      const bytes = new Uint8Array(await file.arrayBuffer());
      const doc = await lib.PDFDocument.load(bytes, { ignoreEncryption: true });
      pdfState.lib = lib;
      pdfState.bytes = bytes;
      pdfState.doc = doc;
      pdfState.pageCount = doc.getPageCount();
      pdfState.pageIndex = pdfState.pageCount - 1;      // 落款通常在最后一页
      pdfState.name = (file.name || 'document').replace(/\.pdf$/i, '');
      pdfDrop.hidden = true;
      pdfEditor.hidden = false;
      syncSigPreview();
      syncPageView();
    } catch (e) {
      pdfDrop.hidden = false;
      pdfEditor.hidden = true;
      toast(e && e.message === 'lib'
        ? 'PDF 组件没加载成功，确认 vendor/pdf-lib.min.js 还在'
        : '这个 PDF 打不开，可能加了密码');
    }
  }

  pdfFileEl.addEventListener('change', function (e) {
    const f = e.target.files && e.target.files[0];
    if (f) openPdf(f);
  });

  ['dragenter', 'dragover'].forEach(function (t) {
    pdfDrop.addEventListener(t, function (e) {
      e.preventDefault();
      pdfDrop.classList.add('over');
    });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    pdfDrop.addEventListener(t, function (e) {
      e.preventDefault();
      pdfDrop.classList.remove('over');
    });
  });
  pdfDrop.addEventListener('drop', function (e) {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) openPdf(f);
  });

  // 拖动签名定位
  let pdfDrag = false;
  pdfSig.addEventListener('pointerdown', function (e) {
    pdfDrag = true;
    e.preventDefault();
    try { pdfSig.setPointerCapture(e.pointerId); } catch (_) {}
  });
  pdfSig.addEventListener('pointermove', function (e) {
    if (!pdfDrag) return;
    const r = pdfPage.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 100;
    const y = (e.clientY - r.top) / r.height * 100;
    pdfState.pos = {
      x: Math.max(0, Math.min(100, x)),
      y: Math.max(0, Math.min(100, y))
    };
    applySigPos();
  });
  window.addEventListener('pointerup', function () { pdfDrag = false; });

  pdfSizeEl.addEventListener('input', function () {
    pdfState.ratio = parseFloat(pdfSizeEl.value);
    pdfSizeVal.textContent = Math.round(pdfState.ratio) + '%';
    applySigPos();
  });

  document.getElementById('pdfPrev').addEventListener('click', function () {
    if (pdfState.pageIndex > 0) { pdfState.pageIndex--; syncPageView(); }
  });
  document.getElementById('pdfNext').addEventListener('click', function () {
    if (pdfState.pageIndex < pdfState.pageCount - 1) { pdfState.pageIndex++; syncPageView(); }
  });

  document.getElementById('pdfReset').addEventListener('click', function () {
    pdfState.bytes = null;
    pdfState.doc = null;
    pdfDrop.hidden = false;
    pdfEditor.hidden = true;
    pdfFileEl.value = '';
  });

  async function exportPdf() {
    if (!pdfState.bytes) { toast('先选一个 PDF'); return; }
    const out = renderCropped(false);
    if (!out) { toast('先在上面写个签名'); return; }
    pdfTip.textContent = '正在生成…';
    try {
      const lib = pdfState.lib || await loadPdfLib();
      // 每次都从原始字节重新载入，否则重复导出会把签名一层层叠上去
      const doc = await lib.PDFDocument.load(pdfState.bytes, { ignoreEncryption: true });
      const blob = await new Promise(function (r) { out.toBlob(r, 'image/png'); });
      const png = new Uint8Array(await blob.arrayBuffer());
      const img = await doc.embedPng(png);

      const page = doc.getPage(pdfState.pageIndex);
      const sz = page.getSize();
      const w = sz.width * (pdfState.ratio / 100);
      const h = w * (img.height / img.width);
      const cx = sz.width * (pdfState.pos.x / 100);
      const cyTop = sz.height * (pdfState.pos.y / 100);

      // PDF 原点在左下、y 轴朝上，这里把「距顶部」换算成「距底部」
      page.drawImage(img, {
        x: cx - w / 2,
        y: sz.height - cyTop - h / 2,
        width: w,
        height: h
      });

      const saved = await doc.save();
      const a = document.createElement('a');
      a.download = pdfState.name + '_已签.pdf';
      a.href = URL.createObjectURL(new Blob([saved], { type: 'application/pdf' }));
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      pdfTip.textContent = '';
      toast('已导出签好的 PDF');
    } catch (e) {
      pdfTip.textContent = '';
      toast('导出失败：' + (e && e.message ? e.message : '未知错误'));
    }
  }
  document.getElementById('pdfApply').addEventListener('click', exportPdf);

  // 签名改动后，示意页上的缩略图跟着更新（防抖，免得每次落笔都编码一遍 PNG）
  let pdfSigTimer;
  function refreshPdfSig() {
    if (!pdfState.bytes || pdfEditor.hidden) return;
    clearTimeout(pdfSigTimer);
    pdfSigTimer = setTimeout(syncSigPreview, 350);
  }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1700);
  }

  // 记住上次用的墨色、粗细、是否带日期
  const PREF_KEY = 'signpad.prefs.v1';

  function savePrefs() {
    try {
      localStorage.setItem(PREF_KEY, JSON.stringify({
        color: color, lineWidth: lineWidth, withDate: withDateEl.checked, taper: inkStrength
      }));
    } catch (_) {}
  }

  (function restorePrefs() {
    let p = null;
    try { p = JSON.parse(localStorage.getItem(PREF_KEY) || 'null'); } catch (_) { return; }
    if (!p) return;

    if (typeof p.lineWidth === 'number' && p.lineWidth >= 1.5 && p.lineWidth <= 8) {
      widthEl.value = String(p.lineWidth);
    }
    if (typeof p.taper === 'number' && p.taper >= 0 && p.taper <= 1) {
      taperEl.value = String(Math.round(p.taper * 100));
    }
    if (typeof p.color === 'string' && /^#[0-9a-fA-F]{6}$/.test(p.color)) {
      color = p.color;
      const hit = Array.prototype.slice
        .call(document.querySelectorAll('.swatch[data-color]'))
        .filter(b => b.dataset.color.toLowerCase() === color.toLowerCase())[0];
      setActive(hit || null);
      if (!hit && customColor) customColor.value = color;
    }
    if (p.withDate) withDateEl.checked = true;
  })();

  syncWidth();
  syncTaper();
  syncDateState();
  syncUndo();

  // 点色块不弹 input/change 事件，用一次点击冒泡兜底保存
  document.addEventListener('click', () => setTimeout(savePrefs, 0));
  widthEl.addEventListener('change', savePrefs);
  taperEl.addEventListener('change', savePrefs);
  withDateEl.addEventListener('change', savePrefs);
  dateInput.addEventListener('change', savePrefs);

  setup();
})();
</script>
</body>
</html>
